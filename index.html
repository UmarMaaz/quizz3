<!DOCTYPE html>

<head>

<title>CSS/FPSC MPT Quiz — Set 10</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1c1c1c; --sub:#6b6b6b;
  --accent:#0f5132; --accent2:#8a6d00; --line:#e4e1da; --danger:#8a1f11; --good:#0f5132bb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161512; --card:#1f1e1a; --ink:#f0efe9; --sub:#a9a69d; --line:#33322c;
  }
}
:root[data-theme="dark"]{--bg:#161512;--card:#1f1e1a;--ink:#f0efe9;--sub:#a9a69d;--line:#33322c;}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Georgia','Times New Roman',serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100%;
}
.wrap{max-width:720px;margin:0 auto;padding:24px 18px 60px;}
header{text-align:center;margin-bottom:20px;}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:.3px;}
.sub{color:var(--sub);font-size:.85rem;font-family:system-ui,sans-serif;}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;}
.section-picker{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px;}
.chip{
  font-family:system-ui,sans-serif;font-size:.8rem;padding:7px 13px;border-radius:20px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.progress-row{display:flex;justify-content:space-between;align-items:center;font-family:system-ui,sans-serif;font-size:.8rem;color:var(--sub);margin-bottom:10px;}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px;}
.bar-fill{height:100%;background:var(--accent);transition:width .25s;}
.qtag{font-family:system-ui,sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent2);margin-bottom:8px;}
.qtext{font-size:1.15rem;line-height:1.5;margin-bottom:18px;}
.opt{
  display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;
  border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);
  font-family:system-ui,sans-serif;font-size:.95rem;cursor:pointer;
}
.opt:hover{border-color:var(--accent);}
.opt.correct{background:#0f513222;border-color:var(--accent);}
.opt.wrong{background:#8a1f1122;border-color:var(--danger);}
.opt[disabled]{cursor:default;}
.explain{
  margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--bg);
  border:1px dashed var(--line);font-family:system-ui,sans-serif;font-size:.88rem;line-height:1.5;color:var(--sub);
}
.explain b{color:var(--ink);}
.nav-row{display:flex;justify-content:space-between;margin-top:18px;gap:10px;font-family:system-ui,sans-serif;}
button.nav{
  flex:1;padding:11px;border-radius:8px;border:none;background:var(--accent);color:#fff;
  font-size:.9rem;cursor:pointer;
}
button.nav.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
button.nav:disabled{opacity:.4;cursor:default;}
.score-screen{text-align:center;}
.score-num{font-size:3rem;margin:10px 0;color:var(--accent);font-family:system-ui,sans-serif;font-weight:700;}
.start-screen p{font-family:system-ui,sans-serif;color:var(--sub);font-size:.9rem;line-height:1.6;}
footer{text-align:center;font-family:system-ui,sans-serif;font-size:.72rem;color:var(--sub);margin-top:20px;}
</style>
</head>

<script>
const QUESTIONS = [{"section": "Pakistan Affairs", "q": "The Gwadar Port, a key hub of CPEC, is located in which district of Balochistan?", "opts": ["Quetta", "Gwadar", "Turbat", "Khuzdar"], "ans": 1, "exp": "Gwadar Port is located in Gwadar district, along the Arabian Sea coast."}, {"section": "Pakistan Affairs", "q": "The Neelum Valley, known for its scenic beauty, is located in:", "opts": ["Khyber Pakhtunkhwa", "Azad Jammu & Kashmir", "Gilgit-Baltistan", "Punjab"], "ans": 1, "exp": "Neelum Valley is located in Azad Jammu & Kashmir."}, {"section": "Pakistan Affairs", "q": "The Hunza Valley, famous for its scenery and longevity of residents, is located in:", "opts": ["Khyber Pakhtunkhwa", "Azad Kashmir", "Gilgit-Baltistan", "Punjab"], "ans": 2, "exp": "Hunza Valley is located in Gilgit-Baltistan."}, {"section": "Pakistan Affairs", "q": "The Kalash people, known for their unique culture, reside in which valley of Khyber Pakhtunkhwa?", "opts": ["Swat Valley", "Chitral's Kalash Valleys", "Hunza Valley", "Kaghan Valley"], "ans": 1, "exp": "The Kalash people reside in the Kalash Valleys (Bumburet, Rumbur, Birir) in Chitral district."}, {"section": "Pakistan Affairs", "q": "The Deosai Plains, known as the 'Land of Giants', are located in:", "opts": ["Gilgit-Baltistan", "Azad Kashmir", "Khyber Pakhtunkhwa", "Punjab"], "ans": 0, "exp": "The Deosai Plains are located in Gilgit-Baltistan, one of the highest plateaus in the world."}, {"section": "Pakistan Affairs", "q": "The Margalla Hills, overlooking Islamabad, are part of which mountain range?", "opts": ["Karakoram", "Himalayas", "Hindu Kush", "Sulaiman Range"], "ans": 1, "exp": "The Margalla Hills are considered an extension of the Himalayan foothills."}, {"section": "Pakistan Affairs", "q": "Which Pakistani city is located at the confluence of five rivers, giving Punjab its name?", "opts": ["Islamabad is NOT in Punjab", "Lahore", "Multan is near the confluence of rivers", "Panjnad, near Mithankot"], "ans": 3, "exp": "Panjnad, near Mithankot, is where the five rivers of Punjab converge before joining the Indus."}, {"section": "Pakistan Affairs", "q": "The Soan Valley, known for prehistoric Soanian culture artifacts, is located in:", "opts": ["Sindh", "Punjab", "Balochistan", "Khyber Pakhtunkhwa"], "ans": 1, "exp": "The Soan Valley, associated with the ancient Soanian stone-age culture, is located in Punjab."}, {"section": "Pakistan Affairs", "q": "Pakistan's first and only UNESCO-listed natural heritage site is:", "opts": ["Mohenjo-daro", "Taxila", "Central Karakoram National Park (tentative) / none fully inscribed as natural site", "Thatta Monuments"], "ans": 2, "exp": "Pakistan's UNESCO World Heritage Sites are primarily cultural (Mohenjo-daro, Taxila, etc.); natural heritage listing remains limited/tentative for sites like Central Karakoram."}, {"section": "Pakistan Affairs", "q": "The historic city of Taxila, a UNESCO World Heritage Site, is an important center of:", "opts": ["Mughal architecture", "Ancient Gandhara civilization and Buddhist heritage", "Modern industry", "British colonial architecture"], "ans": 1, "exp": "Taxila is renowned for its ancient Gandhara civilization ruins and Buddhist archaeological heritage."}, {"section": "Current Affairs", "q": "The term 'Universal Periodic Review (UPR)' is a mechanism used by which UN body?", "opts": ["UN Security Council", "UN Human Rights Council", "UN General Assembly", "International Court of Justice"], "ans": 1, "exp": "The Universal Periodic Review is conducted by the UN Human Rights Council to assess human rights records of all UN member states."}, {"section": "Current Affairs", "q": "The term 'Quad' in current international relations refers to the strategic grouping of:", "opts": ["US, UK, France, Germany", "US, Japan, India, Australia", "China, Russia, India, Pakistan", "US, Canada, Mexico, Brazil"], "ans": 1, "exp": "The 'Quad' (Quadrilateral Security Dialogue) refers to the strategic partnership between the US, Japan, India, and Australia."}, {"section": "Current Affairs", "q": "The term 'AUKUS' refers to a security partnership between:", "opts": ["Australia, UK, US", "Austria, UK, US", "Australia, Ukraine, Spain", "Argentina, UK, US"], "ans": 0, "exp": "AUKUS is a trilateral security partnership between Australia, the United Kingdom, and the United States, announced in 2021."}, {"section": "Current Affairs", "q": "The International Criminal Court (ICC) is distinct from the ICJ in that it:", "opts": ["Handles disputes between states", "Prosecutes individuals for international crimes like genocide and war crimes", "Only handles trade disputes", "Is part of the UN Security Council"], "ans": 1, "exp": "The ICC prosecutes individuals for serious international crimes, while the ICJ settles disputes between states."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The term 'Hudud' in Islamic law refers to:", "opts": ["Voluntary acts of worship", "Fixed punishments prescribed in the Quran for specific crimes", "Charitable giving", "Pilgrimage rites"], "ans": 1, "exp": "'Hudud' refers to specific, fixed punishments prescribed in Islamic law for certain serious crimes."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The term 'Qisas' in Islamic law refers to:", "opts": ["Charity obligation", "The principle of retributive justice/equal retaliation", "A pilgrimage rite", "A form of prayer"], "ans": 1, "exp": "'Qisas' refers to the Islamic legal principle of retributive justice, such as 'an eye for an eye', with provisions for forgiveness/compensation."}, {"section": "Islamic Studies / Civics & Ethics", "q": "'Diyat' in Islamic law refers to:", "opts": ["A pilgrimage rite", "Compensation/blood money paid to victims or their heirs", "A form of charity", "A prayer ritual"], "ans": 1, "exp": "'Diyat' refers to compensation paid to the victim or their family, especially in cases of bodily harm or death."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The term 'Waqf' in Islamic economics refers to:", "opts": ["An interest-based loan", "A charitable religious endowment", "A trade tariff", "A pilgrimage fund"], "ans": 1, "exp": "'Waqf' refers to an inalienable charitable endowment under Islamic law, often used for religious, educational, or social purposes."}, {"section": "Islamic Studies / Civics & Ethics", "q": "'Ijarah' in Islamic finance refers to:", "opts": ["An interest-based loan", "A leasing contract", "A charity fund", "A government bond"], "ans": 1, "exp": "'Ijarah' refers to an Islamic leasing contract, where one party rents out an asset to another for a fee."}, {"section": "Islamic Studies / Civics & Ethics", "q": "'Musharakah' in Islamic finance refers to:", "opts": ["A joint partnership where all partners contribute capital and share profit/loss", "An interest-based loan", "A government bond", "A charity fund"], "ans": 0, "exp": "'Musharakah' is a partnership structure where all partners contribute capital and share in profits and losses."}, {"section": "English", "q": "Choose the correct sentence: 'I wish I ___ taller.'", "opts": ["am", "was", "were", "will be"], "ans": 2, "exp": "In hypothetical wishes about the present, 'were' is used: 'I wish I were taller.'"}, {"section": "English", "q": "'To cry over spilt milk' means:", "opts": ["To be very emotional", "To worry uselessly about something that has already happened and can't be changed", "To clean up a mess", "To argue about something trivial"], "ans": 1, "exp": "This idiom means to worry or be upset about something that has already happened and cannot be undone."}, {"section": "English", "q": "Choose the word closest in meaning to 'Succinct':", "opts": ["Lengthy", "Brief and clearly expressed", "Confusing", "Formal"], "ans": 1, "exp": "'Succinct' means expressed briefly and clearly."}, {"section": "English", "q": "Choose the correctly spelled word:", "opts": ["Maintainance", "Maintenance", "Maintenence", "Maintanance"], "ans": 1, "exp": "The correct spelling is 'Maintenance'."}, {"section": "English", "q": "Identify the correct sentence:", "opts": ["The data is conclusive.", "The data are conclusive.", "Both A and B are acceptable depending on style/context.", "The datas are conclusive."], "ans": 2, "exp": "'Data' can be treated as singular (informal/common usage) or plural (formal/traditional, as plural of 'datum'); both are widely accepted depending on context."}, {"section": "General Science & Ability", "q": "If a:b:c = 2:3:4 and a+b+c=63, find the value of c.", "opts": ["21", "24", "28", "32"], "ans": 2, "exp": "Total parts=9; 1 part=63/9=7; c=4×7=28."}, {"section": "General Science & Ability", "q": "A sum of Rs. 6,000 becomes Rs. 7,200 in 4 years at simple interest. Find the rate.", "opts": ["4%", "5%", "6%", "8%"], "ans": 1, "exp": "SI=1200; Rate=(1200×100)/(6000×4)=5%."}, {"section": "General Science & Ability", "q": "The next term in the series: 5, 10, 20, 40, 80, ?", "opts": ["120", "140", "160", "180"], "ans": 2, "exp": "Each term doubles: 80×2=160."}, {"section": "General Science & Ability", "q": "If the length of a rectangle is 18 cm and its area is 162 cm², find its width.", "opts": ["7 cm", "8 cm", "9 cm", "10 cm"], "ans": 2, "exp": "Width=Area/Length=162/18=9 cm."}, {"section": "General Science & Ability", "q": "Convert 0.625 into a fraction in its simplest form.", "opts": ["5/8", "3/5", "7/10", "9/16"], "ans": 0, "exp": "0.625=625/1000=5/8."}, {"section": "Pakistan Affairs", "q": "The Siachen Glacier dispute between Pakistan and India concerns a region located in:", "opts": ["Punjab", "The Karakoram range, near Ladakh", "Sindh", "Balochistan"], "ans": 1, "exp": "The Siachen Glacier, a site of military standoff, is located in the Karakoram range near the Ladakh region."}, {"section": "Pakistan Affairs", "q": "The Line of Control (LoC) was established following which agreement?", "opts": ["Tashkent Declaration 1966", "Simla Agreement 1972", "Lahore Declaration 1999", "Karachi Agreement 1949"], "ans": 1, "exp": "The Line of Control was formally established under the Simla Agreement of 1972, renaming the earlier ceasefire line."}, {"section": "Pakistan Affairs", "q": "The Karachi Agreement of 1949 was significant for establishing:", "opts": ["Pakistan's constitution", "A ceasefire line in Kashmir", "Trade relations with India", "Pakistan's first budget"], "ans": 1, "exp": "The Karachi Agreement (1949) established the ceasefire line in Kashmir following the first Indo-Pak war."}, {"section": "Pakistan Affairs", "q": "Pakistan's National Language, as per the Constitution, is:", "opts": ["English", "Urdu", "Punjabi", "Sindhi"], "ans": 1, "exp": "Urdu is designated as Pakistan's national language in the Constitution."}, {"section": "Pakistan Affairs", "q": "According to the 2023 census, which province has the largest population in Pakistan?", "opts": ["Sindh", "Punjab", "Khyber Pakhtunkhwa", "Balochistan"], "ans": 1, "exp": "Punjab remains Pakistan's most populous province."}, {"section": "Pakistan Affairs", "q": "The Cholistan Desert, known for its annual jeep rally, is located in which province?", "opts": ["Sindh", "Punjab", "Balochistan", "Khyber Pakhtunkhwa"], "ans": 1, "exp": "The Cholistan Desert is located in southern Punjab."}, {"section": "Pakistan Affairs", "q": "The Thar Desert, Pakistan's largest desert, is primarily located in:", "opts": ["Punjab", "Sindh", "Balochistan", "Khyber Pakhtunkhwa"], "ans": 1, "exp": "The Thar Desert is primarily located in Sindh province, extending into India."}, {"section": "Pakistan Affairs", "q": "Pakistan's first indigenous-built Jinnah-class frigate is associated with which branch of the armed forces?", "opts": ["Army", "Navy", "Air Force", "Rangers"], "ans": 1, "exp": "The Jinnah-class frigates are naval vessels developed for the Pakistan Navy."}, {"section": "Pakistan Affairs", "q": "The Pakistan Army's highest military award for gallantry is:", "opts": ["Sitara-e-Jurat", "Nishan-e-Haider", "Tamgha-e-Basalat", "Hilal-e-Jurat"], "ans": 1, "exp": "Nishan-e-Haider is Pakistan's highest military gallantry award."}, {"section": "Pakistan Affairs", "q": "The Pakistan Air Force was formally established on:", "opts": ["14 August 1947", "1948", "1950", "1965"], "ans": 0, "exp": "The Pakistan Air Force traces its establishment to 14 August 1947, alongside the creation of Pakistan."}, {"section": "Current Affairs", "q": "The term 'Digital Diplomacy' refers to:", "opts": ["Traditional embassy-based diplomacy only", "The use of digital/social media tools in conducting foreign relations", "Military cyber operations", "Trade negotiations"], "ans": 1, "exp": "Digital diplomacy refers to using digital platforms and social media as tools of modern diplomatic engagement."}, {"section": "Current Affairs", "q": "The term 'Economic Diplomacy' refers to:", "opts": ["Military alliances", "Using diplomatic tools to advance a country's economic interests abroad", "Humanitarian aid only", "Cultural exchange programs"], "ans": 1, "exp": "Economic diplomacy involves using diplomatic relationships and tools to advance trade, investment, and economic interests."}, {"section": "Current Affairs", "q": "The term 'Public Diplomacy' refers to:", "opts": ["Government-to-government negotiations only", "Engaging directly with foreign publics to build mutual understanding", "Military cooperation", "Trade sanctions"], "ans": 1, "exp": "Public diplomacy involves engaging with foreign publics (rather than just governments) to build understanding and influence perceptions."}, {"section": "Current Affairs", "q": "The 'Responsibility to Protect (R2P)' doctrine relates to:", "opts": ["Trade protection", "International intervention to prevent genocide, war crimes, and mass atrocities", "Climate policy", "Economic sanctions only"], "ans": 1, "exp": "R2P is an international principle holding that states (and the international community) have a responsibility to protect populations from mass atrocities."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The term 'Khums' in Islamic finance (particularly in Shia jurisprudence) refers to:", "opts": ["A 2.5% tax on wealth", "A one-fifth (20%) levy on certain types of income/wealth", "A pilgrimage fee", "A charity for orphans only"], "ans": 1, "exp": "'Khums' refers to a one-fifth levy on certain income, notably emphasized in Shia Islamic jurisprudence."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The term 'Sunni' and 'Shia' division in Islam primarily originated over disagreement about:", "opts": ["Prayer direction", "Succession/leadership after the Prophet's death", "Fasting rules", "The Quran's authenticity"], "ans": 1, "exp": "The Sunni-Shia division primarily originated from disagreement over rightful succession (Caliphate) after the Prophet's death."}, {"section": "Islamic Studies / Civics & Ethics", "q": "'Ashura', observed on the 10th of Muharram, commemorates which historic event for many Muslims?", "opts": ["The Hijrah", "The Battle of Karbala and martyrdom of Imam Hussain (RA)", "The Conquest of Makkah", "The first revelation"], "ans": 1, "exp": "Ashura commemorates the martyrdom of Imam Hussain (RA) at the Battle of Karbala in 680 CE, among other historic events."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The term 'Sufism' in Islam primarily emphasizes:", "opts": ["Strict legalism", "Inner spiritual purification and closeness to Allah", "Political governance", "Military jihad"], "ans": 1, "exp": "Sufism emphasizes the spiritual and mystical dimension of Islam, focusing on inner purification and closeness to Allah."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Data Ganj Bakhsh, a revered Sufi saint, is associated with which Pakistani city?", "opts": ["Multan", "Lahore", "Karachi", "Sehwan"], "ans": 1, "exp": "Data Ganj Bakhsh's shrine is located in Lahore, a major Sufi pilgrimage site."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Lal Shahbaz Qalandar, a famous Sufi saint, is associated with which Pakistani city?", "opts": ["Multan", "Lahore", "Sehwan Sharif", "Uch Sharif"], "ans": 2, "exp": "Lal Shahbaz Qalandar's shrine is located in Sehwan Sharif, Sindh."}, {"section": "English", "q": "Choose the correct sentence: 'Scarcely had he left ___ the phone rang.'", "opts": ["than", "when", "that", "then"], "ans": 1, "exp": "'Scarcely...when' is the correct idiomatic pairing for sequential events."}, {"section": "English", "q": "Choose the correct sentence: 'No sooner had she arrived ___ it started raining.'", "opts": ["when", "then", "than", "that"], "ans": 2, "exp": "'No sooner...than' is the correct idiomatic pairing."}, {"section": "English", "q": "'To jump on the bandwagon' means:", "opts": ["To start a new trend alone", "To join a popular trend or activity that others are already doing", "To avoid a popular activity", "To criticize something popular"], "ans": 1, "exp": "This idiom means to join an activity or trend because it has become popular or fashionable."}, {"section": "English", "q": "'To kill two birds with one stone' means:", "opts": ["To harm two people", "To accomplish two tasks with a single effort", "To waste time", "To fail at a task"], "ans": 1, "exp": "This idiom means to achieve two objectives through a single action."}, {"section": "English", "q": "Choose the word closest in meaning to 'Gregarious':", "opts": ["Shy and withdrawn", "Sociable and outgoing", "Angry", "Serious"], "ans": 1, "exp": "'Gregarious' means sociable, fond of company."}, {"section": "English", "q": "Choose the word closest in meaning to 'Fastidious':", "opts": ["Careless", "Very attentive to detail and hard to please", "Fast-moving", "Generous"], "ans": 1, "exp": "'Fastidious' means very attentive to detail, often excessively so."}, {"section": "English", "q": "Choose the correctly spelled word:", "opts": ["Entrepreneur", "Enterpreneur", "Entreprenuer", "Entreprenneur"], "ans": 0, "exp": "The correct spelling is 'Entrepreneur'."}, {"section": "English", "q": "Choose the correct form: 'She suggested that he ___ early.'", "opts": ["leaves", "left", "leave", "will leave"], "ans": 2, "exp": "After 'suggest that', the subjunctive mood uses the base form: 'suggested that he leave'."}, {"section": "General Science & Ability", "q": "If the cost price of an article is Rs. 800 and it is sold at a 15% loss, find the selling price.", "opts": ["Rs. 650", "Rs. 680", "Rs. 700", "Rs. 720"], "ans": 1, "exp": "SP=CP×(1−0.15)=800×0.85=Rs. 680."}, {"section": "General Science & Ability", "q": "A sum of money amounts to Rs. 6,760 in 2 years and Rs. 7,098 in 3 years at simple interest. Find the annual interest.", "opts": ["Rs. 338", "Rs. 350", "Rs. 360", "Rs. 400"], "ans": 0, "exp": "Interest for 1 extra year = 7098−6760 = Rs. 338."}, {"section": "General Science & Ability", "q": "Find the LCM of 15, 20, and 30.", "opts": ["60", "90", "120", "150"], "ans": 0, "exp": "15=3×5; 20=2²×5; 30=2×3×5. LCM=2²×3×5=60."}, {"section": "General Science & Ability", "q": "If 3/4 of a number is 60, find the number.", "opts": ["75", "80", "85", "90"], "ans": 1, "exp": "x×3/4=60 → x=80."}, {"section": "General Science & Ability", "q": "A sum of Rs. 9,000 is lent at 8% per annum simple interest for 2.5 years. Find the interest.", "opts": ["Rs. 1,600", "Rs. 1,700", "Rs. 1,800", "Rs. 2,000"], "ans": 2, "exp": "SI=(9000×8×2.5)/100=Rs. 1,800."}, {"section": "General Science & Ability", "q": "The next term in the series: 1, 3, 7, 15, 31, ?", "opts": ["47", "55", "63", "71"], "ans": 2, "exp": "Each term = previous×2+1: 31×2+1=63."}, {"section": "General Science & Ability", "q": "If a:b=3:4, find (a+b):(a−b).", "opts": ["7:1", "1:7", "3:4", "4:3"], "ans": 0, "exp": "Let a=3k,b=4k; a+b=7k; a−b=−k. Taking magnitude, (a+b):(b−a)=7:1."}, {"section": "Pakistan Affairs", "q": "Pakistan's largest hydroelectric power station is:", "opts": ["Mangla Dam", "Tarbela Dam", "Warsak Dam", "Ghazi-Barotha"], "ans": 1, "exp": "Tarbela Dam is Pakistan's largest hydroelectric power station by installed capacity."}, {"section": "Pakistan Affairs", "q": "The Pakistan Mint, which produces the country's coins, is located in:", "opts": ["Islamabad", "Lahore", "Karachi", "Quetta"], "ans": 1, "exp": "The Pakistan Security Printing Corporation/Mint operations are notably based in Lahore."}, {"section": "Pakistan Affairs", "q": "The State Bank of Pakistan, the central bank, was established in:", "opts": ["1947", "1948", "1950", "1956"], "ans": 1, "exp": "The State Bank of Pakistan was established on 1 July 1948."}, {"section": "Pakistan Affairs", "q": "Pakistan's stock exchange, formed by merging three regional exchanges, is called:", "opts": ["Karachi Stock Exchange", "Pakistan Stock Exchange (PSX)", "Lahore Stock Exchange", "Islamabad Stock Exchange"], "ans": 1, "exp": "The Pakistan Stock Exchange (PSX) was formed in 2016 by merging the Karachi, Lahore, and Islamabad stock exchanges."}, {"section": "Pakistan Affairs", "q": "The Pakistan Television drama/entertainment industry is primarily centered in which two cities?", "opts": ["Karachi and Lahore", "Islamabad and Peshawar", "Multan and Quetta", "Faisalabad and Sialkot"], "ans": 0, "exp": "Pakistan's television and drama industry is primarily centered in Karachi and Lahore."}, {"section": "Current Affairs", "q": "The term 'Climate Refugee' refers to:", "opts": ["A person fleeing political persecution", "A person displaced primarily due to environmental/climate-related disasters", "A war refugee", "An economic migrant"], "ans": 1, "exp": "A climate refugee is someone displaced primarily due to environmental changes or climate-related disasters."}, {"section": "Current Affairs", "q": "The term 'Food Security' refers to:", "opts": ["Military protection of farms", "Consistent access to sufficient, safe, and nutritious food", "Food export regulations", "Agricultural subsidies only"], "ans": 1, "exp": "Food security refers to all people having consistent physical and economic access to sufficient, safe, and e & Ability", "q": "A worker completes a job in 15 days; with help from another worker, they finish in 6 days. Find the second worker's time alone.", "opts": ["8 days", "9 days", "10 days", "12 days"], "ans": 2, "exp": "Combined rate=1/6; Worker1 rate=1/15; Worker2 rate=1/6−1/15=5/30−2/30=3/30=1/10, so 10 days."}, {"section": "General Science & Ability", "q": "Find the next term: 1, 2, 4, 7, 11, 16, ?", "opts": ["20", "21", "22", "23"], "ans": 2, "exp": "Differences increase by 1 each time (1,2,3,4,5): 16+6=22."}, {"section": "General Science & Ability", "q": "A sum of Rs. 3,600 is divided equally among 6 people, then each gives 1/4 of their share to charity. Find the total amount donated.", "opts": ["Rs. 700", "Rs. 800", "Rs. 900", "Rs. 1,000"], "ans": 2, "exp": "Each share=3600/6=600; each donates 600/4=150; total donated=6×150=Rs. 900."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Pakistan Resolution's alternative name, 'Qarardad-e-Pakistan', was adopted during which Muslim League session?", "opts": ["Lahore session, 1940", "Delhi session, 1943", "Karachi session, 1943", "Lucknow session, 1937"], "ans": 0, "exp": "The Pakistan Resolution (Qarardad-e-Pakistan) was adopted at the Muslim League's Lahore session in March 1940."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Direct Action Day, called by the Muslim League, took place on:", "opts": ["16 August 1946", "14 August 1947", "23 March 1940", "11 September 1948"], "ans": 0, "exp": "Direct Action Day was observed on 16 August 1946, leading to widespread communal violence in Calcutta."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The transfer of power ceremony in Karachi, marking Pakistan's independence, took place on:", "opts": ["14 August 1947", "15 August 1947", "11 August 1947", "23 March 1947"], "ans": 0, "exp": "The transfer of power ceremony in Karachi took place on 14 August 1947."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "Pakistan's first Constituent A ces", "To plan carefully"], "ans": 1, "exp": "This idiom warns against risking everything on a single plan or venture rather than diversifying."}, {"section": "English", "q": "'To see eye to eye' means:", "opts": ["To argue constantly", "To agree with someone", "To avoid someone", "To stare at someone"], "ans": 1, "exp": "This idiom means to be in agreement with someone."}, {"section": "English", "q": "Choose the word closest in meaning to 'Obsolete':", "opts": ["Modern", "No longer in use; outdated", "Expensive", "Rare but valuable"], "ans": 1, "exp": "'Obsolete' means no longer produced or used; out of date."}, {"section": "English", "q": "Choose the correctly spelled word:", "opts": ["Harass", "Harrass", "Harasss", "Harrasss"], "ans": 0, "exp": "The correct spelling is 'Harass' (single 'r', double 's')."}, {"section": "General Science & Ability", "q": "If the ratio of boys to girls in a class is 3:2 and there are 30 students total, find the number of girls.", "opts": ["10", "12", "14", "15"], "ans": 1, "exp": "Total parts=5; 1 part=30/5=6; girls=2×6=12."}, {"section": "General Science & Ability", "q": "A sum of Rs. 4,800 is divided between A and B such that A's share is 3/5 of B's share. Find A's share.", "opts": ["Rs. 1,600", "Rs. 1,800", "Rs. 2,000", "Rs. 2,200"], "ans": 1, "exp": "Let B=5x, A=3x; total=8x=4800 → x=600; A's share=3×600=Rs. 1,800."}, {"section": "General Science & Ability", "q": "Find the value of (144)^(1/2) + (64)^(1/3):", "opts": ["14", "15", "16", "18"], "ans": 2, "exp": "√144=12; cube root of 64=4; 12+4=16."}, {"section": "General Science & Ability", "q": "If a car travels 180 km in 3 hours, how long will it take to travel 420 km at the same speed?", "opts": ["6 hours", "6.5 hours", "7 hours", "7.5 hours"], "ans": 2, "exp": "Speed=180/3=60 km/h; Time=420/60=7 hours."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Objectives Resolution was later incorporated as a substantive part of the Constitution through the:", "opts": ["8th Amendment", "18th Amendment", "8th Amendment (1985) making it a preamble annex", "2nd Amendment"], "ans": 2, "exp": "The Objectives Resolution was made a substantive part of the Constitution via the 8th Amendment in 1985, as Article 2A."}];

const SECTIONS = [...new Set(QUESTIONS.map(q=>q.section))];
let state = {
  section: 'All',
  pool: [],
  idx: 0,
  answered: {},
  score: 0
};

function buildPool(section){
  const list = section === 'All' ? QUESTIONS : QUESTIONS.filter(q=>q.section===section);
  return list.map((q,i)=>({...q, poolIndex:i}));
}

function startQuiz(section){
  state.section = section;
  state.pool = buildPool(section);
  state.idx = 0;
  state.answered = {};
  state.score = 0;
  renderQuestion();
}

function renderStart(){
  const app = document.getElementById('app');
  let chips = SECTIONS.map(s=>`<div class="chip" data-sec="${s}">${s} (${QUESTIONS.filter(q=>q.section===s).length})</div>`).join('');
  app.innerHTML = `
    <div class="card start-screen">
      <p>Choose a section to focus on, or take the full mixed quiz. Each question shows a short explanation right after you answer.</p>
      <div class="section-picker">
        <div class="chip active" data-sec="All">All Sections (${QUESTIONS.length})</div>
        ${chips}
      </div>
      <div class="nav-row">
        <button class="nav" id="beginBtn">Start Quiz</button>
      </div>
    </div>`;
  let chosen = 'All';
  document.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click', ()=>{
      document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      c.classList.add('active');
      chosen = c.dataset.sec;
    });
  });
  document.getElementById('beginBtn').addEventListener('click', ()=> startQuiz(chosen));
}

function renderQuestion(){
  const app = document.getElementById('app');
  const total = state.pool.length;
  const q = state.pool[state.idx];
  const pct = Math.round((state.idx/total)*100);
  const already = state.answered[state.idx];

  const optsHtml = q.opts.map((opt,i)=>{
    let cls = 'opt';
    let disabledAttr = '';
    if(already !== undefined){
      disabledAttr = 'disabled';
      if(i === q.ans) cls += ' correct';
      else if(i === already) cls += ' wrong';
    }
    return `<button class="${cls}" data-i="${i}" ${disabledAttr}>${String.fromCharCode(65+i)}. ${opt}</button>`;
  }).join('');

  const explainHtml = already !== undefined ? `<div class="explain"><b>${already===q.ans?'Correct. ':'Not quite. '}</b>${q.exp}</div>` : '';

  app.innerHTML = `
    <div class="progress-row">
      <span>Question ${state.idx+1} / ${total}</span>
      <span>Score: ${state.score}</span>
    </div>
    <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="qtag">${q.section}</div>
      <div class="qtext">${q.q}</div>
      ${optsHtml}
      ${explainHtml}
      <div class="nav-row">
        <button class="nav secondary" id="prevBtn" ${state.idx===0?'disabled':''}>Previous</button>
        <button class="nav" id="nextBtn" ${already===undefined?'disabled':''}>${state.idx===total-1?'Finish':'Next'}</button>
      </div>
    </div>`;

  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(state.answered[state.idx] !== undefined) return;
      const i = parseInt(btn.dataset.i);
      state.answered[state.idx] = i;
      if(i === q.ans) state.score++;
      renderQuestion();
    });
  });
  document.getElementById('prevBtn').addEventListener('click', ()=>{
    if(state.idx>0){ state.idx--; renderQuestion(); }
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(state.idx < total-1){ state.idx++; renderQuestion(); }
    else renderScore();
  });
}

function renderScore(){
  const app = document.getElementById('app');
  const total = state.pool.length;
  const pct = Math.round((state.score/total)*100);
  app.innerHTML = `
    <div class="card score-screen">
      <div class="qtag">${state.section}</div>
      <div>You scored</div>
      <div class="score-num">${state.score} / ${total}</div>
      <div class="sub">${pct}% correct</div>
      <div class="nav-row">
        <button class="nav secondary" id="retryBtn">Retry Section</button>
        <button class="nav" id="homeBtn">Choose Another Section</button>
      </div>
    </div>`;
  document.getElementById('retryBtn').addEventListener('click', ()=> startQuiz(state.section));
  document.getElementById('homeBtn').addEventListener('click', renderStart);
}

renderStart();
</script>
